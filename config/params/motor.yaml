# Parameter Registry: motor readout (owner spec 005). Schema: flycolony.registry.Entry.
# Thresholds are ASSUMPTIONs set by one global calibration against spontaneous activity (005 M8).

entries:
  - id: motor.walk_forward.threshold_hz
    value: 33.0
    units: "Hz"
    valid_range: [0, 1000]
    assumption:
      rationale: "Global calibration (005 M8): q0.99 of the resting group rate, rounded up to 0.5 Hz (resting mean 7.04 Hz, q0.99 32.86 Hz; specs/005-motor/reports/female-fafb783-t2.motor-calibration.json)."
      owner: "005"
    owner_spec: "005"
  - id: motor.walk_forward.half_hz
    value: 20.0
    units: "Hz above threshold at half command"
    valid_range: [0.1, 1000]
    assumption:
      rationale: "Saturation scale of the transfer function."
      owner: "005"
    owner_spec: "005"
  - id: motor.walk_forward.max
    value: 20.0
    units: "mm/s"
    valid_range: [0, 10000]
    source:
      authors: "Strauss R., Heisenberg M."
      year: 1993
      where: "J Comp Physiol A 172:45, walking up to ~2 cm/s"
    owner_spec: "005"
  - id: motor.walk_forward.latency_ms
    value: 30.0
    units: "ms"
    valid_range: [0, 1000]
    assumption:
      rationale: "DN activity to movement onset (MOTOR-R-009)."
      owner: "005"
    owner_spec: "005"
  - id: motor.walk_forward.effort_cost
    value: 1.0
    units: "effort units per unit command"
    valid_range: [0, 1000]
    assumption:
      rationale: "Relative energetic cost (flight >> walking; 006 converts to energy)."
      owner: "005"
    owner_spec: "005"
