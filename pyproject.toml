[project]
name = "flycolony"
version = "0.1.0"
description = "A colony of connectome-driven fruit flies observed by a hidden Watcher."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary (non-commercial project; see data/LICENSES.md for dataset terms)" }
dependencies = [
    "numpy>=2.0",
    "polars>=1.20",
    "pyarrow>=18",
    "duckdb>=1.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "typer>=0.12",
    "httpx>=0.27",
    "psutil>=6.0",
    "torch>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "pytest-benchmark>=4.0",
    "ruff>=0.7",
]
reference = [
    "brian2>=2.10.1",
    "joblib>=1.6.0",
    "pandas>=3.0.6",
]

[project.scripts]
colony = "flycolony.console.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flycolony"]

# PyTorch wheels: CUDA build on Windows/Linux (works on any NVIDIA GPU the build
# supports and falls back to CPU when no GPU is present). Other accelerators
# install their own torch wheel; the code is device-agnostic (spec 014, HW-R-001).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "data: needs downloaded datasets under data/raw (skipped when absent)",
    "gpu: needs a CUDA device (skipped when absent)",
    "perf: performance test",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501: the formatter owns line length; B008: Typer declares CLI options as defaults.
ignore = ["RUF001", "RUF002", "RUF003", "E501", "B008"]

# Import contracts. Checked by tools/lint.py (pure Python) in the test suite; import-linter
# reads the same section where its native extension is allowed to load.
[tool.importlinter]
root_package = "flycolony"

[[tool.importlinter.contracts]]
name = "Engine never imports the Watcher, console or LLM (CONST-2, plan §3)"
type = "forbidden"
source_modules = [
    "flycolony.connectome",
    "flycolony.brain",
    "flycolony.body",
    "flycolony.world",
    "flycolony.senses",
    "flycolony.motor",
    "flycolony.physiology",
    "flycolony.genetics",
    "flycolony.comms",
    "flycolony.engine",
]
forbidden_modules = ["flycolony.watcher", "flycolony.console", "flycolony.tasks"]

[[tool.importlinter.contracts]]
name = "Production code never imports the test-only stimulation fixture (CONST-1.4)"
type = "forbidden"
source_modules = ["flycolony"]
forbidden_modules = ["tests"]
